openapi: 3.0.0
info:
  title: mock-api
  description: >-
    ## mock-api


    This collection provides a mock API layer for simulating a complete user
    authentication and account management backend. It is organized into three
    functional groups:


    ### Auth


    Handles all authentication flows, including user **registration**,
    **login**, and **token re-authentication** (`re-auth`). Use these endpoints
    to simulate onboarding new users and managing session tokens.


    ### User


    Covers core user account operations such as **logout**, **password
    updates**, **account deletion**, **session management**, **listing users**,
    and retrieving **user info**. These endpoints represent the full lifecycle
    of a user account.


    ### Profile


    Contains the **create-profile** endpoint for setting up a user's profile
    after registration.


    ---


    This collection is intended for use with a mock server to enable frontend
    development and integration testing without requiring a live backend. Global
    variables `BASE_URL` and `accessToken` are used across requests for base URL
    configuration and bearer token authorization.
  version: 1.0.0
servers:
  - url: undefined://{{BASE_URL}}
tags:
  - name: auth
  - name: user
paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: gorav@gmail.com
                password: Root@123
                confirm_password: Root@123
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /auth/login:
    post:
      tags:
        - auth
      summary: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: admin@gmail.com
                password: Root@123
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /auth/refresh-token:
    get:
      tags:
        - auth
      summary: re-auth
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/logout:
    get:
      tags:
        - user
      summary: logout
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/profile:
    post:
      tags:
        - user
      summary: update-profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                first_name: gorav
                last_name: yadav
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/activation:
    post:
      tags:
        - user
      summary: activation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                user_id: 1
                is_active: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/update-password:
    put:
      tags:
        - user
      summary: update-password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                old_password: Root@1234
                new_password: Root@123
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/2:
    delete:
      tags:
        - user
      summary: delete-user
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/session:
    get:
      tags:
        - user
      summary: session
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/all:
    get:
      tags:
        - user
      summary: users
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/1:
    get:
      tags:
        - user
      summary: user-info
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
