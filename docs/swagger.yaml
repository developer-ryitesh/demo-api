openapi: 3.0.0
info:
  title: mock-api
  version: 1.0.0
servers:
  - url: undefined://{{BASE_URL}}
tags:
  - name: auth
  - name: user
  - name: profile
paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: gorav@gmail.com
                password: Root@123
                confirm_password: Root@123
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /auth/login:
    post:
      tags:
        - auth
      summary: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: admin@gmail.com
                password: Root@1234
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /auth/refresh-token:
    get:
      tags:
        - auth
      summary: re-auth
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/logout:
    get:
      tags:
        - user
      summary: logout
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/update-password:
    put:
      tags:
        - user
      summary: update-password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                oldPassword: Root@1234
                newPassword: Root@123
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/2:
    delete:
      tags:
        - user
      summary: delete-user
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/session:
    get:
      tags:
        - user
      summary: session
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/all:
    get:
      tags:
        - user
      summary: users
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/1:
    get:
      tags:
        - user
      summary: user-info
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /user/profile:
    post:
      tags:
        - profile
      summary: create-profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                first_name: admin
                last_name: sudso
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
